<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduTrack — BCA Student Progress Tracker</title>
  <meta name="description" content="BCA IGNOU students ka subject-wise theory aur assignment progress ek jagah dekhein."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- TOP NAVBAR -->
<header class="site-header"></header>

<!-- MAIN -->
<main class="page-body">

  <!-- HOME TOOLBAR -->
  <div class="home-toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Student khojein (naam ya enrollment)..." oninput="filterCards()"/>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <select class="filter-select" id="semFilter" onchange="filterCards()">
        <option value="">Sabhi Semester</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
      </select>
      <button class="btn btn-secondary btn-sm" onclick="exportDatabaseJSON()" title="Export database to JSON file">
        <span>📤 Export JSON</span>
      </button>
      <button class="btn btn-secondary btn-sm" onclick="openBackupModal()" title="Import database from JSON file">
        <span>📥 Import JSON</span>
      </button>
      <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Student Add Karein</button>
    </div>
  </div>


  <!-- STATS -->
  <div class="stats-row" id="statsRow"></div>

  <!-- SECTION TITLE -->
  <div class="section-title">👨‍🎓 Sabhi Students</div>

  <!-- STUDENT GRID -->
  <div class="students-grid" id="studentsGrid"></div>

</main>

<!-- ADD STUDENT MODAL -->
<div class="modal-overlay" id="addModal" onclick="handleOverlayClick(event,'addModal')">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('addModal')">✕</button>
    <div class="modal-title" id="modalTitle">➕ Naya Student Add Karein</div>
    <form id="studentForm" onsubmit="saveStudent(event)">
      <div class="form-group">
        <label>Naam *</label>
        <input type="text" id="f_name" placeholder="Jaise: Rohit Sharma" required/>
      </div>
      <div class="form-group">
        <label>Enrollment Number</label>
        <input type="text" id="f_enrollment" placeholder="Jaise: BCA2022010"/>
      </div>
      <div class="form-group">
        <label>Current Semester *</label>
        <select id="f_semester" required>
          <option value="">— Semester chunein —</option>
          <option value="1">Semester 1</option>
          <option value="2">Semester 2</option>
          <option value="3">Semester 3</option>
          <option value="4">Semester 4</option>
          <option value="5">Semester 5</option>
          <option value="6">Semester 6</option>
        </select>
      </div>
      <div class="form-group">
        <label>Contact / Email</label>
        <input type="text" id="f_contact" placeholder="Phone ya Email"/>
      </div>
      <input type="hidden" id="f_editId"/>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal('addModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">💾 Save Karein</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="globalToast"></div>

<script src="app.js"></script>
<script>
  let DB = loadDB();

  // ── RENDER STATS ──────────────────────────────────
  function renderStats() {
    let pendingT = 0, pendingA = 0, allDone = 0;
    DB.students.forEach(s => {
      const st = getStudentStats(s);
      if (st.theoryPending > 0) pendingT++;
      if (st.assignPending > 0) pendingA++;
      if (st.pct === 100) allDone++;
    });
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card blue"><span class="stat-icon">👨‍🎓</span><div><div class="stat-label">Total Students</div><div class="stat-val">${DB.students.length}</div></div></div>
      <div class="stat-card green"><span class="stat-icon">✅</span><div><div class="stat-label">Sabhi Complete</div><div class="stat-val">${allDone}</div></div></div>
      <div class="stat-card amber"><span class="stat-icon">📖</span><div><div class="stat-label">Theory Pending</div><div class="stat-val">${pendingT}</div></div></div>
      <div class="stat-card red"><span class="stat-icon">📝</span><div><div class="stat-label">Assignment Pending</div><div class="stat-val">${pendingA}</div></div></div>
    `;
  }

  // ── RENDER CARDS ──────────────────────────────────
  function renderCards(list) {
    const grid = document.getElementById('studentsGrid');
    if (!list.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🔍</div>
        <p>Koi student nahi mila</p>
        <button class="btn btn-primary" onclick="openAddModal()">+ Student Add Karein</button>
      </div>`;
      return;
    }
    grid.innerHTML = list.map(s => {
      const st = getStudentStats(s);
      const color = getColor(s.colorIdx);
      const theoryPill = st.theoryPending > 0
        ? `<span class="pill pill-amber">⚠️ Theory Pending: ${st.theoryPending}</span>`
        : `<span class="pill pill-green">✅ Theory OK</span>`;
      const assignPill = st.assignPending > 0
        ? `<span class="pill pill-red">❌ Assignment Pending: ${st.assignPending}</span>`
        : `<span class="pill pill-green">✅ Assignment OK</span>`;
      return `
        <div class="student-card" onclick="openStudent(${s.id})" id="card-${s.id}">
          <div class="card-top">
            <div class="avatar" style="background:${color};box-shadow:0 4px 16px ${color}55">${getInitials(s.name)}</div>
            <div class="card-info">
              <div class="card-name">${s.name}</div>
              <div class="card-enroll">${s.enrollment || '—'}</div>
            </div>
            <div class="sem-badge">Sem ${s.semester}</div>
          </div>
          <div class="prog-wrap">
            <div class="prog-labels">
              <span>Subjects Complete</span>
              <span>${st.fullyComplete}/${st.total} &nbsp; ${st.pct}%</span>
            </div>
            <div class="prog-bg"><div class="prog-fill" style="width:${st.pct}%"></div></div>
          </div>
          <div class="pills-row">
            ${theoryPill}
            ${assignPill}
          </div>
        </div>
      `;
    }).join('');
  }

  function openStudent(id) {
    window.open('student.html?id=' + id, '_blank');
  }

  // ── FILTER ──────────────────────────────────────
  function filterCards() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const sem = document.getElementById('semFilter').value;
    const filtered = DB.students.filter(s => {
      const matchSearch = !search ||
        s.name.toLowerCase().includes(search) ||
        (s.enrollment || '').toLowerCase().includes(search);
      const matchSem = !sem || s.semester === parseInt(sem);
      return matchSearch && matchSem;
    });
    renderCards(filtered);
  }

  // ── ADD/EDIT MODAL ──────────────────────────────
  function openAddModal() {
    document.getElementById('modalTitle').textContent = '➕ Naya Student Add Karein';
    document.getElementById('studentForm').reset();
    document.getElementById('f_editId').value = '';
    document.getElementById('addModal').classList.add('open');
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  function handleOverlayClick(e, id) {
    if (e.target === document.getElementById(id)) closeModal(id);
  }

  function saveStudent(e) {
    e.preventDefault();
    const name = document.getElementById('f_name').value.trim();
    const enrollment = document.getElementById('f_enrollment').value.trim();
    const semester = parseInt(document.getElementById('f_semester').value);
    const contact = document.getElementById('f_contact').value.trim();
    const editId = parseInt(document.getElementById('f_editId').value);

    if (editId) {
      const idx = DB.students.findIndex(s => s.id === editId);
      if (idx !== -1) {
        const old = DB.students[idx];
        // reset subjects if semester changed
        const subjects = old.semester !== semester ? {} : old.subjects;
        DB.students[idx] = { ...old, name, enrollment, semester, contact, subjects };
      }
      showToast('✅ Student update ho gaya!');
    } else {
      const newStudent = {
        id: nextId(DB.students),
        name, enrollment, semester, contact,
        colorIdx: DB.students.length % 8,
        documents: [],
        subjects: {},
        createdAt: Date.now()
      };
      DB.students.push(newStudent);
      showToast('🎉 Naya student add ho gaya!');
    }
    saveDB(DB);
    closeModal('addModal');
    renderStats();
    filterCards();
    renderGlobalNavbar('home');
  }

  // ── KEYBOARD SHORTCUT ──────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal('addModal');
  });

  // ── INIT ────────────────────────────────────────
  renderGlobalNavbar('home');
  renderStats();
  filterCards();

  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('add') === '1') {
    openAddModal();
  }
</script>
</body>
</html>
